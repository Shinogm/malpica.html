<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hola Mundo HTMX</title>
  <script src="https://unpkg.com/htmx.org@1.9.2"></script>
</head>
<body>
  <h1>Hola Mundo con HTMX</h1>

  <button hx-swap="outerHTML" hx-trigger="click" hx-select="#mensaje">
    ¡Haz clic!
  </button>

  <div id="mensaje" style="display:none;">
    ¡Hola, HTMX
  </div>

  <script>
    document.querySelector("button").addEventListener("click", function() {
      document.getElementById("mensaje").style.display = "block";
    });
  </script>
</body>
</html>
