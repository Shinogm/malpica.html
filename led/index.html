<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Interactivo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --text-color: #ecf0f1;
            --led-base: #ff9500;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: linear-gradient(135deg, #2c3e50, #1a2530);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        h1:after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: var(--accent-color);
            border-radius: 3px;
        }
        
        .led-container {
            position: relative;
            margin: 40px auto;
            width: 150px;
            height: 150px;
            perspective: 500px;
        }
        
        .led {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 40% 40%, var(--led-base), #ff6500);
            border-radius: 50%;
            box-shadow: 
                0 0 40px var(--led-base),
                0 0 60px var(--led-base),
                inset 0 0 20px rgba(255, 255, 255, 0.4),
                inset 0 -20px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
        }
        
        .led:before {
            content: '';
            position: absolute;
            top: 15%;
            left: 15%;
            width: 30%;
            height: 30%;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            filter: blur(5px);
        }
        
        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-top: 30px;
        }
        
        .control-group {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
            position: relative;
        }
        
        .control-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .control-title i {
            margin-right: 10px;
            color: var(--accent-color);
        }
        
        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        
        .value-display {
            min-width: 70px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            text-align: center;
            font-family: monospace;
            font-size: 1rem;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.7;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .led-container {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LED Interactivo</h1>
        
        <div class="led-container">
            <div class="led" id="led"></div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <div class="control-title">
                    <i class="fas fa-bolt"></i> Color (Voltaje)
                </div>
                <div class="slider-container">
                    <input type="range" id="colorSlider" min="0" max="255" value="150">
                    <div class="value-display" id="voltaje">2.03V</div>
                </div>
            </div>
            
            <div class="control-group">
                <div class="control-title">
                    <i class="fas fa-sun"></i> Intensidad
                </div>
                <div class="slider-container">
                    <input type="range" id="intensidadSlider" min="0" max="100" value="100">
                    <div class="value-display" id="intensidad">100%</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            Simulación de LED interactivo con controles de voltaje e intensidad
        </div>
    </div>

    <script>
        const led = document.getElementById("led");
        const colorSlider = document.getElementById("colorSlider");
        const intensidadSlider = document.getElementById("intensidadSlider");
        const voltajeText = document.getElementById("voltaje");
        const intensidadText = document.getElementById("intensidad");

        function updateLED() {
            const colorValue = colorSlider.value;
            const voltage = (2.03 + (colorValue / 255) * 0.07).toFixed(2);
            voltajeText.textContent = `${voltage}V`;
            
            const intensidad = intensidadSlider.value;
            intensidadText.textContent = `${intensidad}%`;
            
            // Actualizar el color y la opacidad del LED
            led.style.background = `radial-gradient(circle at 40% 40%, rgb(255, ${colorValue}, 0), rgb(255, ${Math.max(0, colorValue-50)}, 0))`;
            led.style.opacity = intensidad / 100;
            
            // Actualizar el resplandor (box-shadow)
            const shadowColor = `rgb(255, ${colorValue}, 0)`;
            led.style.boxShadow = `
                0 0 ${20 + intensidad/5}px ${shadowColor},
                0 0 ${40 + intensidad/2.5}px ${shadowColor},
                inset 0 0 20px rgba(255, 255, 255, ${intensidad/200 + 0.3}),
                inset 0 -20px 30px rgba(0, 0, 0, 0.2)
            `;
            
            // Variable CSS para efectos adicionales
            document.documentElement.style.setProperty('--led-base', `rgb(255, ${colorValue}, 0)`);
        }

        colorSlider.addEventListener("input", updateLED);
        intensidadSlider.addEventListener("input", updateLED);
        
        // Inicializar
        updateLED();
    </script>
</body>
</html>
